models:
  - name: stg_jaffle_shop__customers
    description: The grain of this table is one unique customerper row
    columns: 
      - name: customer_id
        description: A unique key for this table
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: One order per row
    columns: 
      - name: order_id
        description: unique key for order
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{doc('order_status')}}"
        data_tests:
        - accepted_values:
            arguments:
              values:
                - completed
                - shipped
                - placed
                - return_pending
                - returned

      - name: customer_id
        description: unique primary key for joining on other tables
        data_tests:
        - relationships:
            arguments:
              field: customer_id
              to: ref('stg_jaffle_shop__customers')
                  
