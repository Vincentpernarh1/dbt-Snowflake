version: 2

sources:
  - name: stripe
    description: Table with payment information for orders
    database: raw
    schema: stripe
    tables:
      - name: payment
        description: Table that contains all payments made for orders by order ID
        columns:
          - name: id
            description: Unique primary ID of the table used to merge with other tables.
            data_tests:
              - unique
              - not_null
